<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Future Digital Experience</title>
    <meta name="description" content="NEXORA Digital - AI, Web, Automation and Digital Transformation.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* كود التصميم السينمائي الاحترافي المدمج */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #030812; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* الشبكة السيبرانية المتحركة ثنائية الأبعاد وثلاثية الأبعاد */
        .boot-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(60deg) translateY(-30%) translateZ(0); transform-origin: top center; animation: gridMove 12s linear infinite; z-index: 1; }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 480px; } }
        
        .boot-core { position: relative; z-index: 10; text-align: center; max-width: 600px; padding: 20px; background: rgba(3, 8, 18, 0.8); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0, 243, 255, 0.05); }
        .eyebrow { font-family: 'Space Grotesk', sans-serif; color: #00f3ff; text-transform: uppercase; letter-spacing: 4px; font-size: 14px; font-weight: 700; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; margin-bottom: 15px; line-height: 1.2; }
        h1 span { color: #00f3ff; }
        p { color: #8fa0dd; font-size: 14px; letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; }
        
        /* زر التشغيل والاندماج السينمائي */
        #enterBtn { background: transparent; color: #00f3ff; border: 2px solid #00f3ff; padding: 12px 35px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        #enterBtn:hover { background: #00f3ff; color: #030812; box-shadow: 0 0 30px rgba(0, 243, 255, 0.6); transform: translateY(-2px); }
        .boot-note { font-size: 11px; color: #4b597b; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="boot-grid"></div>

    <div id="boot">
        <div class="boot-core">
            <div class="eyebrow">NEXORA DIGITAL</div>
            <h1>THE FUTURE <br><span>IS BUILDABLE.</span></h1>
            <p>AI • WEB • AUTOMATION • DIGITAL INTELLIGENCE</p>
            <button id="enterBtn" onclick="startExperience()">ENTER EXPERIENCE</button>
            <div class="boot-note">Best experienced fullscreen • Audio background integrated</div>
        </div>
    </div>

    <!-- ملف الصوت المدمج من المسار الرئيسي لقراءته فوراً -->
    <audio id="futureAudio" src="nexora-future.mp3" loop></audio>

    <script>
        // كود الحركة والتشغيل الصوتي السينمائي المدمج
        function startExperience() {
            const audio = document.getElementById('futureAudio');
            
            // تشغيل الموسيقى الخلفية الفاخرة المرفوعة في مستودعك
            audio.play().then(() => {
                console.log("Audio playing successfully.");
            }).catch(err => {
                console.log("Audio playback blocked or file missing: ", err);
            });
            
            // إضافة تأثير حركي عند الضغط لفتح النظام والآدمن
            document.querySelector('.boot-core').style.transform = 'scale(0.95)';
            document.querySelector('.boot-core').style.opacity = '0';
            document.querySelector('.boot-core').style.transition = 'all 0.5s ease';
            
            setTimeout(() => {
                // ينقلك مباشرة للوحة تحكم المدير العام الحقيقية بعد انتهاء المقدمة السينمائية
                window.location.href = "http://localhost:3000"; 
            }, 600026);
        }
    </script>
</body>
</html>
